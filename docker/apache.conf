# 家常菜谱 · Apache 站点配置
#
# 唯一要记住的一点：DocumentRoot 是 public/，不是项目根目录。
# 源码、data/（数据库 + 上传图片）、seed/ 全在 docroot 之外，浏览器够不着。

<VirtualHost *:80>
    ServerName _default_
    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted

        # 存在的文件（app.css、favicon.svg…）直接放行；
        # 其余全部交给 index.php —— 包括 /uploads/xxx.webp 和 /api/*。
        # 图片不在 docroot 里，是被 PHP 读出来流出去的，所以这里要放行到 index.php。
        RewriteEngine On
        RewriteCond %{REQUEST_FILENAME} -f [OR]
        RewriteCond %{REQUEST_FILENAME} -d
        RewriteRule ^ - [L]
        RewriteRule ^ /index.php [L]
    </Directory>

    # 防呆：万一以后有人把 DocumentRoot 挪回 /var/www/html，这一道门还在。
    # 源码 / data（数据库 + 上传图片）/ seed 全在这一层下面。
    # 更具体的 <Directory /var/www/html/public> 会覆盖它，所以不影响正常访问。
    <Directory /var/www/html>
        Require all denied
    </Directory>

    # 图片、字体这类静态资源长缓存；index.php 由 PHP 自己发 Cache-Control
    <IfModule mod_expires.c>
        ExpiresActive On
        ExpiresByType text/css                 "access plus 7 days"
        ExpiresByType application/javascript    "access plus 7 days"
        ExpiresByType image/svg+xml             "access plus 30 days"
        ExpiresByType image/webp                "access plus 30 days"
    </IfModule>

    <IfModule mod_headers.c>
        Header always set X-Content-Type-Options "nosniff"
        Header always set X-Frame-Options "SAMEORIGIN"
        Header always set Referrer-Policy "same-origin"
        # 前端没用到摄像头/麦克风/定位，直接掐掉
        Header always set Permissions-Policy "geolocation=(), camera=(), microphone=()"
    </IfModule>

    # 反代（Nginx / 宝塔 / 群晖）后面跑 HTTPS 时，让 PHP 知道原始协议，
    # 否则 Secure Cookie 和生成的链接会错。
    SetEnvIfNoCase X-Forwarded-Proto "^https$" HTTPS=on

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
